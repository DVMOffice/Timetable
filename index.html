<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-2027 UCVM Timetable</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════ TOP BAR ═══════════════ -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="app-brand">
        <span class="app-ucvm">UCVM</span>
        <span class="app-brand-sep"></span>
        <span class="app-title">2026-2027 Timetable</span>
      </div>
      <div class="conn-status"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></div>
    </div>
    <div class="top-bar-right">
      <button class="btn-icon" id="dark-toggle" title="Toggle dark mode">🌙</button>
      <button class="btn-icon" id="admin-toggle" title="Admin mode">⚙</button>
    </div>
  </div>

  <!-- ═══════════════ FILTER / NAV BAR ═══════════════ -->
  <div class="filter-bar-wrap">
    <div class="filter-bar-inner">

      <h1 class="page-title">2026-2027 UCVM Timetable</h1>

      <!-- Year buttons -->
      <div class="btn-row" id="year-btn-row">
        <button class="pill-btn active" data-year="all">All Years</button>
        <button class="pill-btn" data-year="1">Year 1</button>
        <button class="pill-btn" data-year="2">Year 2</button>
        <button class="pill-btn" data-year="3">Year 3</button>
      </div>

      <!-- Week buttons (populated dynamically in app.js) -->
      <div class="btn-row btn-row-scroll" id="week-btn-row">
        <button class="pill-btn active" data-week="all">All Weeks</button>
      </div>

      <div class="filter-row">
        <div class="fbar-item fbar-search">
          <span class="fbar-icon">🔍</span>
          <input type="text" class="fbar-input" id="search-input" placeholder="Search course, topic, instructor…" />
        </div>

        <div class="fbar-item">
          <span class="fbar-label">Month</span>
          <div class="fbar-select-wrap">
            <select class="fbar-select" id="filter-month">
              <option value="all">All Months</option>
              <!-- populated in app.js: August 2026 → April 2027 -->
            </select>
            <span class="fbar-arrow">▾</span>
          </div>
        </div>

        <div class="fbar-item fbar-course">
          <span class="fbar-label">Course</span>
          <div class="fbar-select-wrap">
            <select class="fbar-select" id="filter-course"><option value="all">All Courses</option></select>
            <span class="fbar-arrow">▾</span>
          </div>
        </div>

        <div class="fbar-item">
          <span class="fbar-label">Type</span>
          <div class="fbar-select-wrap">
            <select class="fbar-select" id="filter-type">
              <option value="all">All Types</option>
              <option value="LEC">LEC</option>
              <option value="LAB">LAB</option>
              <option value="SRL">SRL</option>
              <option value="Quiz/Midterm">Quiz/Midterm</option>
              <option value="OSCE">OSCE</option>
              <option value="Exam">Exam</option>
            </select>
            <span class="fbar-arrow">▾</span>
          </div>
        </div>

        <button class="fbar-reset" id="reset-filters">↺ Reset</button>
        <button class="fbar-reset" id="color-toggle">🎨 Colors: On</button>
      </div>

      <div class="active-chips-row hidden" id="active-chips-row">
        <span class="active-chips-label">Active:</span>
        <div class="filter-bar-chips" id="filter-chips"></div>
        <button class="chips-clear" id="chips-clear">Clear all</button>
      </div>

    </div>
  </div>

  <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
  <div class="main-content">

    <!-- Calendar toolbar -->
    <div class="cal-toolbar">
      <div class="cal-nav">
        <button class="btn-cal-nav" id="cal-prev">‹</button>
        <span class="cal-label-text" id="cal-label"></span>
        <button class="btn-cal-nav" id="cal-next">›</button>
      </div>
      <button class="btn-cal-today" id="cal-today">Today</button>
      <div class="cal-view-toggle">
        <button class="cal-view-btn" id="cal-month-btn">Month</button>
        <button class="cal-view-btn active" id="cal-week-btn">Week</button>
      </div>
    </div>

    <div class="main-view">
      <div class="cal-column">
        <div class="cal-card">
          <div id="calendar-body"></div>
        </div>
        <!-- Search results render here instead of the calendar when a search is active -->
        <div class="cal-card search-results-card hidden" id="search-results-card">
          <div id="search-results-body"></div>
        </div>
      </div>

      <div class="updates-column">
        <div class="updates-panel-header">
          <span class="updates-panel-title">📋 Latest Updates</span>
          <span class="updates-panel-sub">Most recent changes across all sessions</span>
          <div class="updates-filters">
            <select class="updates-filter-select" id="updates-filter-year">
              <option value="all">All Years</option>
              <option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option>
            </select>
            <select class="updates-filter-select" id="updates-filter-course"><option value="all">All Courses</option></select>
            <select class="updates-filter-select" id="updates-filter-week"><option value="all">All Weeks</option></select>
          </div>
        </div>
        <div class="updates-panel-body" id="latest-updates-body"></div>
      </div>
    </div>

    <!-- ═══════════════ EXPORT BAR (bottom) ═══════════════ -->
    <div class="export-bar">
      <div class="export-group">
        <span class="export-group-label">Master List</span>
        <button class="export-btn" data-export="master-xlsx">Excel</button>
        <button class="export-btn" data-export="master-csv">CSV</button>
        <button class="export-btn" data-export="master-ics">ICS</button>
      </div>
      <div class="export-group">
        <span class="export-group-label">Current View</span>
        <button class="export-btn" data-export="view-pdf">PDF</button>
      </div>
      <div class="export-group">
        <span class="export-group-label">Filtered / Search Results</span>
        <button class="export-btn" data-export="filtered-xlsx">Excel</button>
        <button class="export-btn" data-export="filtered-csv">CSV</button>
        <button class="export-btn" data-export="filtered-ics">ICS</button>
        <button class="export-btn" data-export="filtered-pdf">PDF</button>
      </div>
    </div>

  </div>

  <!-- ═══════════════ MODAL (edit form / import / read-only detail) ═══════════════ -->
  <div class="modal-container" id="modal"></div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="courseData.js"></script>
  <script src="calendarEngine.js"></script>
  <script src="app.js"></script>
</body>
</html>
