<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026-2027 UCVM Timetable</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════ FREEZE / FILTER PANEL ═══════════════ -->
  <div class="filter-bar-wrap" id="filter-bar-wrap">
    <button class="filter-toggle-btn" id="filter-toggle-btn">Filters ▾</button>
    <div class="filter-bar-inner" id="filter-bar-inner">

      <div class="brand-block">
        <span class="brand-line brand-line-1">2026-2027</span>
        <span class="brand-line brand-line-2">UCVM</span>
        <span class="brand-line brand-line-3">Timetable</span>
      </div>

      <div class="filter-stack">

        <!-- Year row -->
        <div class="filter-block-row">
          <span class="filter-block-label">Year</span>
          <div class="btn-row btn-row-left" id="year-btn-row">
            <button class="pill-btn" data-year="1">Year 1</button>
            <button class="pill-btn" data-year="2">Year 2</button>
            <button class="pill-btn" data-year="3">Year 3</button>
            <button class="pill-btn active" data-year="all">All Years</button>
          </div>
        </div>

        <!-- Semester row -->
        <div class="filter-block-row">
          <span class="filter-block-label">Semester</span>
          <div class="btn-row btn-row-left" id="semester-btn-row">
            <button class="pill-btn active" data-semester="fall">Fall</button>
            <button class="pill-btn" data-semester="winter">Winter</button>
          </div>
        </div>

        <!-- Week rows (populated dynamically in app.js — split across two lines, no scroll) -->
        <div class="filter-block-row filter-block-row-top">
          <span class="filter-block-label">Week</span>
          <div class="week-btn-lines">
            <div class="btn-row btn-row-left" id="week-btn-row-1"></div>
            <div class="btn-row btn-row-left" id="week-btn-row-2"></div>
          </div>
        </div>

        <!-- Search / Month / Course / Type / Reset -->
        <div class="filter-row">
          <div class="fbar-item fbar-search">
            <span class="fbar-label">Search 🔍</span>
            <input type="text" class="fbar-input" id="search-input" placeholder="course, topic, instructor" />
          </div>

          <div class="fbar-item">
            <span class="fbar-label">Month</span>
            <div class="fbar-select-wrap">
              <select class="fbar-select" id="filter-month">
                <option value="all">All Months</option>
              </select>
              <span class="fbar-arrow">▾</span>
            </div>
          </div>

          <div class="fbar-item fbar-course" id="course-filter-wrap">
            <span class="fbar-label">Course</span>
            <button class="fbar-dropdown-btn" id="course-filter-btn" type="button">All Courses ▾</button>
            <div class="fbar-dropdown-list hidden" id="course-filter-list"></div>
          </div>

          <div class="fbar-item">
            <span class="fbar-label">Type</span>
            <div class="fbar-select-wrap">
              <select class="fbar-select" id="filter-type">
                <option value="all">All Types</option>
                <option value="LEC">LEC</option>
                <option value="LAB">LAB</option>
                <option value="SRL">SRL</option>
                <option value="Quiz/Midterm">Quiz/Midterm</option>
                <option value="OSCE">OSCE</option>
                <option value="Exam">Exam</option>
              </select>
              <span class="fbar-arrow">▾</span>
            </div>
          </div>

          <button class="fbar-reset" id="reset-filters">↺ Reset</button>
        </div>

        <div class="active-chips-row hidden" id="active-chips-row">
          <span class="active-chips-label">Active:</span>
          <div class="filter-bar-chips" id="filter-chips"></div>
          <button class="chips-clear" id="chips-clear">Clear all</button>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
  <div class="main-content">
    <button class="side-toggle-btn" id="side-toggle-btn" title="Hide Latest Updates / Data Export panel">›</button>
    <div class="main-view" id="main-view">

      <div class="cal-column">
        <div class="cal-toolbar">
          <button class="btn-cal-today" id="cal-today">Today</button>
          <div class="cal-nav">
            <button class="btn-cal-nav" id="cal-prev">‹</button>
            <span class="cal-label-text" id="cal-label"></span>
            <button class="btn-cal-nav" id="cal-next">›</button>
          </div>
          <div class="cal-toolbar-right">
            <button class="fbar-reset" id="color-toggle">🎨 Colors: On</button>
            <div class="cal-view-toggle">
              <button class="cal-view-btn" id="cal-month-btn">Month</button>
              <button class="cal-view-btn active" id="cal-week-btn">Week</button>
            </div>
          </div>
        </div>

        <div class="cal-card" id="cal-card">
          <div id="calendar-body"></div>
        </div>
        <div class="cal-card search-results-card hidden" id="search-results-card">
          <div id="search-results-body"></div>
        </div>
      </div>

      <div class="side-column">
        <div class="side-panel updates-panel" id="updates-panel">
          <div class="side-panel-header">
            <span class="side-panel-title">📋 Latest Updates</span>
            <span class="side-panel-sub">Most recent changes across all sessions</span>
            <div class="updates-filters">
              <select class="updates-filter-select" id="updates-filter-year">
                <option value="all">All Years</option>
                <option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option>
              </select>
              <select class="updates-filter-select" id="updates-filter-course"><option value="all">All Courses</option></select>
              <select class="updates-filter-select" id="updates-filter-week"><option value="all">All Weeks</option></select>
            </div>
          </div>
          <div class="side-panel-body" id="latest-updates-body"></div>
        </div>

        <div class="side-panel export-panel">
          <div class="side-panel-header">
            <span class="side-panel-title">📤 Data Export</span>
          </div>
          <div class="side-panel-body export-panel-body">
            <div class="export-section-label">Export Master List</div>
            <div class="export-btn-row">
              <button class="export-btn" data-export="master-xlsx">Excel</button>
              <button class="export-btn" data-export="master-csv">CSV</button>
              <button class="export-btn" data-export="master-ics">ICS</button>
            </div>
            <div class="export-section-label">Export Filtered Results</div>
            <div class="export-btn-row">
              <button class="export-btn" data-export="filtered-xlsx">Excel</button>
              <button class="export-btn" data-export="filtered-csv">CSV</button>
              <button class="export-btn" data-export="filtered-ics">ICS</button>
              <button class="export-btn" data-export="filtered-pdf">PDF</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ═══════════════ BOTTOM STATUS / ADMIN BAR ═══════════════ -->
  <div class="bottom-bar">
    <div class="bottom-bar-spacer"></div>
    <div class="bottom-bar-center">
      <span class="conn-status"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></span>
      <button class="admin-login-btn" id="admin-toggle">Administrator Login</button>
    </div>
    <div class="bottom-bar-right">
      <button class="btn-icon" id="dark-toggle" title="Toggle dark mode">🌙</button>
    </div>
  </div>

  <!-- ═══════════════ MODAL (edit form / import / read-only detail) ═══════════════ -->
  <div class="modal-container" id="modal"></div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="courseData.js"></script>
  <script src="calendarEngine.js"></script>
  <script src="app.js"></script>
</body>
</html>
