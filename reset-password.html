<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — UCVM Timetable</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1a1a1a; --muted: #5f6673; --line: #d8dce3; --accent: #c8102e; --bad: #b42318; --good: #027a48; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --card: #1f2227; --text: #eceef1; --muted: #a2a9b4; --line: #3a3f47; --bad: #f97066; --good: #47cd89; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { min-height: 22px; margin: 12px 0 0; }
  #status.bad { color: var(--bad); } #status.good { color: var(--good); }
</style>
</head>
<body>
  <main>
    <h1>Set a new password</h1>
    <p>UCVM Timetable account</p>
    <form id="reset-form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required />
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" minlength="6" autocomplete="new-password" required />
      <button type="submit" id="save">Save password</button>
    </form>
    <div id="status" role="status">Checking your reset link…</div>
  </main>

  <script src="environment.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script>
    (function () {
      'use strict';
      const env = window.TIMETABLE_ENVIRONMENT;
      const client = window.supabase.createClient(env.supabase.url, env.supabase.publishableKey);
      const form = document.getElementById('reset-form');
      const statusEl = document.getElementById('status');
      const show = (text, kind) => { statusEl.textContent = text; statusEl.className = kind || ''; };

      // The client reads the token from the link and signs in on load.
      client.auth.getSession().then(({ data }) => {
        if (data.session) { form.hidden = false; show(''); }
        else show('This reset link is invalid or has expired. Request a new one from the Sign In window.', 'bad');
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        if (password !== document.getElementById('confirm').value) { show('The passwords don\'t match.', 'bad'); return; }
        const button = document.getElementById('save');
        button.disabled = true;
        show('Saving…');
        const { error } = await client.auth.updateUser({ password });
        if (error) { button.disabled = false; show(error.message, 'bad'); return; }
        form.hidden = true;
        show('Password updated. Taking you to the timetable…', 'good');
        setTimeout(() => { location.href = 'index.html'; }, 1500);
      });
    })();
  </script>
</body>
</html>
